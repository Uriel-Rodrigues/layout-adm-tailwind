<!DOCTYPE html>
<html lang="pt-br">
<head>
    <base href="/src/">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/output.css" rel="stylesheet">
    <title>Recuperar senha</title>
</head>

<body class="bg-login">
    
    <!-- divi central -->
    <div class="mt-6 w-full overflow-hidden bg-white px-8 py-4 shadow-md sm:max-w-md sm:rounded-lg">
        <!-- div com a imagem -->
        <div class="flex justify-center mb-4">
            <img src="/public/curso_ia_unimontes-500x500.png" alt="logo" class="h-20 w-20">
        </div>

        <h1 class="text-2xl font-bold text-center text-blue-500">Recuperar senha</h1>
        
        <!-- div com formulario -->
        <div>
            <form action="#" method="post" class="mt-4">
                <label for="email" class="block text-sm font-medium text-gray-700"  >Email</label>
                <input type="email" name="email" id="email" placeholder="email de cadastro" class="mt-1 block w-full rounded-md border-2 border-blue-100 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:outline-none px-3 py-2">
                
                <div class="mt-4 flex items-center justify-between">
                    <a href="/src/index.html" class="link-login">Login</a>
                    
                    <button type="submit" class="btn-primary-md">Recuperar</button>
                </div>

            <!-- login -->
			 <div class="mt-4 text-center">
				<a href="/src/auth/criar_conta.html" class="text-ms text-blue-600 hover:no-underline">Criar nova conta!</a>
			 </div>

            </form>
        </div>  
    </div>
    
</body>
</html>
